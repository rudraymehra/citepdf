# Phase 2 docker-compose.
# Qdrant + Redis run in Docker. API, Streamlit, Chainlit, and the arq worker
# run on the host so they share one HF model cache (~1.8 GB BGE-M3 + reranker).
#
# Phase 4 polish will add Dockerfile.api / Dockerfile.frontend / Dockerfile.worker.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: pdf-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: pdf-rag-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
