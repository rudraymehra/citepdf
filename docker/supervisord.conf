; supervisord runs all 5 processes inside a single HF Spaces container.
; Order: redis -> qdrant -> api -> worker -> chainlit. Each restarts on
; failure so a transient hiccup doesn't take down the whole demo.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:redis]
command=redis-server --bind 127.0.0.1 --dir /data/redis --appendonly yes --save ""
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qdrant]
command=/usr/local/bin/qdrant --config-path /app/docker/qdrant-config.yaml
environment=QDRANT__STORAGE__STORAGE_PATH="/data/qdrant"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
directory=/app
command=uv run uvicorn apps.api.main:app --host 127.0.0.1 --port 8000
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
directory=/app
command=uv run arq apps.worker.worker.WorkerSettings
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chainlit]
directory=/app
command=uv run chainlit run apps/chainlit_ui/app.py --host 0.0.0.0 --port 7860 --headless
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
